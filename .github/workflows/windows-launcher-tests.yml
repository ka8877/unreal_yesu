name: Windows launcher regression

on:
  push:
    paths:
      - 'Tools/PathOfDawnUnreal/**'
      - '.github/workflows/windows-launcher-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Record test environment (no Unreal or GPU test)
        shell: pwsh
        run: |
          $PSVersionTable | Format-List
          python --version
      - name: Native handle isolation and late logs with PowerShell 7 parent
        shell: pwsh
        run: ./Tools/PathOfDawnUnreal/tests/process_launch_tests.ps1
      - name: Native handle isolation and late logs with Windows PowerShell 5.1 parent
        shell: pwsh
        run: ./Tools/PathOfDawnUnreal/tests/process_launch_tests.ps1 -WrapperShell (Get-Command powershell.exe).Source
      - name: Process ownership, save session exclusion and diagnostic collection
        shell: pwsh
        run: |
          ./Tools/PathOfDawnUnreal/tests/tooling_tests.ps1
          ./Tools/PathOfDawnUnreal/tests/start_step_tests.ps1
