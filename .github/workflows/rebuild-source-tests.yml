name: Word Journey source checks
on:
  push:
    paths:
      - 'Games/PathOfDawnUnreal/Source/PathOfDawnUnreal/**/Journey*'
      - 'SourceArt/PathOfDawnUnreal/Rebuild/**'
      - 'Tools/PathOfDawnUnreal/Rebuild/**'
      - '.github/workflows/rebuild-source-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned source-validation dependency
        run: python3 -m pip install Pillow==12.3.0
      - name: Source hashes, scripture metadata, asset policy and journal state
        shell: pwsh
        run: ./Tools/PathOfDawnUnreal/Rebuild/TestRebuild.ps1
