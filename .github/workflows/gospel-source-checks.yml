name: Gospel shared story and portable gameplay

on:
  push:
    paths:
      - 'Games/PathOfDawnUnreal/Source/**/Gospel*'
      - 'Games/PathOfDawnUnreal/Source/**/DawnGospel*'
      - 'SourceArt/PathOfDawnUnreal/Gospel/**'
      - 'Tools/PathOfDawnUnreal/**'
      - '.github/workflows/gospel-source-checks.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Install source font inspection dependency
        run: python -m pip install fonttools==4.61.1
      - name: Evaluate exact pinned Unity catalogs and compare exported bytes
        run: python Tools/PathOfDawnUnreal/Gospel/export_campaign.py --check
      - name: Source contracts, protected imports and packaging fixtures
        run: python -m unittest discover -s Tools/PathOfDawnUnreal/tests -p 'test_gospel_*.py' -v
      - name: Actual C++ story state against canonical content
        run: python Tools/PathOfDawnUnreal/tests/test_gospel_core.py --sanitize
      - name: Korean glyph coverage
        run: python Tools/PathOfDawnUnreal/Gospel/validate_gospel_font.py
      - name: Scope of this workflow
        run: echo 'Portable source tests only. Unreal build, Editor, graphics, USaveGame and streaming are not executed here.'
