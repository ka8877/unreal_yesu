<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>새벽의 길 · Unreal 플레이</title>
<style>body{margin:0;background:#182126;color:#f2ead8;font:16px system-ui,sans-serif}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid #59605b}h1{font-size:18px;margin:0}button{background:#d9c394;color:#182126;border:0;border-radius:4px;padding:10px 16px;cursor:pointer;font:inherit}button:disabled{opacity:.5}#status{font-size:14px}#viewport{height:calc(100vh - 170px);min-height:300px}iframe{width:100%;height:100%;border:0}footer{padding:12px 20px;font-size:13px;line-height:1.6;color:#c3c7c1}.hint{padding:12vh 10vw;line-height:1.8}code{white-space:nowrap}</style>
</head><body><header><h1>새벽의 길: 갈릴리의 첫 아침</h1><button id="start">플레이 화면 열기</button><button id="reconnect" disabled>재연결</button><button id="fullscreen" disabled>전체 화면</button><span id="status" role="status">호스트 확인 중</span></header>
<main id="viewport"><div class="hint">실행 중인 Unreal 게임에 연결합니다.<br>플레이 화면을 연 뒤 영상의 시작 버튼을 눌러 소리와 입력을 활성화하세요.<br>한 번에 하나의 탭만 조작할 수 있습니다.</div></main>
<footer>WASD 이동 · 마우스 시점 · E 조사 · Esc 메뉴. 재연결은 기존 진행으로 돌아갑니다. 새 게임은 게임 안에서 선택하세요.<br>저장은 게임 호스트에 보관됩니다. 화면의 게임 빌드 ID와 아래 호스트 빌드 ID가 일치하는지 확인하세요.</footer>
<script type="module" src="/toolbar.js"></script></body></html>
