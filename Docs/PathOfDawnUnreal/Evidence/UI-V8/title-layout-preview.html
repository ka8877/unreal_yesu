<style>
@font-face{font-family:Dawn;src:url('../../../../SourceArt/PathOfDawnUnreal/Fonts/NotoSansKR.otf')}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07141b;color:#f0e8d1;font-family:Dawn,sans-serif;font-weight:400}body{background-image:linear-gradient(90deg,rgba(5,13,17,.98) 23%,rgba(5,13,17,.72) 42%,rgba(5,13,17,.22) 62%,rgba(5,13,17,.06) 72%),url('../../../../SourceArt/PathOfDawnUnreal/VisualV8/Illustrations/IL_Title_Dawn.png');background-size:cover;background-position:center}#safe{position:absolute;width:1600px;height:900px;transform-origin:top left;--text-scale:1}.position{position:absolute;left:80px;top:44px;bottom:120px;width:510px;display:flex;align-items:center}.content{max-height:730px;overflow:auto;width:100%;scrollbar-width:thin;scrollbar-color:#6a7169 transparent}.text{margin:3px 0 7px;line-height:1.35;font-size:calc(var(--font)*var(--text-scale));font-weight:400}.eyebrow{--font:16px;color:#c29757}h1{--font:78px}h2{--font:28px}.invitation{--font:21px;color:#94a8a6}.hint{--font:16px;color:#94a8a6}.space{height:12px}.rule{height:2px;background:#c29757;width:80px;margin:12px 0 16px}button{font:400 calc(22px*var(--text-scale))/1.35 Dawn,sans-serif;display:block;width:100%;color:#f0e8d1;background:rgba(17,29,32,.8);border:0;text-align:left;padding:8px 18px;margin:4px 0;cursor:default}button.primary{background:rgba(95,71,38,.95)}button:hover,button:focus-visible{background:#29403e;outline:1px solid #c29757;outline-offset:2px}button:disabled{color:#94a8a6;background:rgba(12,18,19,.45)}.badge{position:absolute;right:32px;top:22px;color:#94a8a6;--font:14px}.footnote{position:absolute;left:80px;bottom:24px;width:680px;color:#94a8a6;--font:15px}.preview-label{position:absolute;right:32px;bottom:24px;max-width:610px;text-align:right;background:rgba(5,13,17,.86);padding:10px 14px;font-size:15px;color:#f0e8d1}

<div id="safe"><div class="badge text">새벽의 길 / V8 UI LAYOUT PREVIEW</div><div class="position"><main class="content"><div class="eyebrow text">서사 어드벤처 / 첫 번째 이야기</div><div class="space"></div><h1 class="text">새벽의 길</h1><h2 class="text">갈릴리의 첫 아침</h2><div class="rule"></div><p class="invitation text">먼 시간의 호숫가,<br>당신이 함께한 순간이 기억으로 남습니다.</p><div class="space"></div><button class="primary">새 게임 · 여정 시작</button><button disabled>이어하기</button><button>설정</button><button>제작 및 각색 기록</button><button>게임 종료</button><div style="height:8px"></div><p class="hint text">새 게임을 시작해도 발견한 기억은 간직합니다.</p></main></div><p class="footnote text">성경의 사건을 바탕으로 구성한 창작 서사입니다. 여행자의 존재, 선택과 시간 회귀는 허구입니다.</p><div class="preview-label">UI 레이아웃 미리보기 · Unreal 실행 캡처 아님<br>버튼은 동작하지 않습니다.</div></div>
<script>function fit(){const scale=Math.min(innerWidth/1600,innerHeight/900);const safe=document.getElementById('safe');safe.style.left=((innerWidth-1600*scale)/2)+'px';safe.style.top=((innerHeight-900*scale)/2)+'px';safe.style.transform='scale('+scale+')';safe.style.setProperty('--text-scale',new URLSearchParams(location.search).get('textScale')||'1')}addEventListener('resize',fit);fit();</script>
